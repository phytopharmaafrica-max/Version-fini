    <path d="M130 190 Q170 185 195 150" stroke="#bbf7d0" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M170 145 Q210 140 225 110" stroke="#bbf7d0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8" />
